version: '3.8'

services:
  # 1. Local MySQL Database
  mysql-db:
    platform: linux/amd64
    image: mysql:8.0.36
    container_name: loan_mysql_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loan_risk_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Local FastAPI ML Service (Build from source)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: loan_ml_service_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Local Spring Boot Backend (Build from source)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan_backend_service_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-rootpassword123}}
      - DB_NAME=${MYSQL_DATABASE:-loan_risk_db}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8000}
    depends_on:
      mysql-db:
        condition: service_healthy
      ml-service:
        condition: service_healthy

volumes:
  mysql_dev_data: